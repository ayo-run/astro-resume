name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Type-checks the demo site, which consumes the package the same way a
      # real project does — so it also catches breaking changes to the types.
      - name: Astro check (demo)
        run: pnpm check

      # Publishing no runtime dependencies is what keeps a consumer's tree
      # clean no matter what this repo's dev lockfile carries. Assert that
      # invariant rather than audit it.
      #
      # `pnpm audit --prod` was the obvious check here and is the wrong one:
      # audit reads the whole workspace lockfile and ignores --filter, so its
      # "production" scope is the demo app's 182-package Astro tree and none
      # of what we publish. Pinning the demo back to astro 6.1.3 turns it red
      # with `demo>astro` paths — a failure that tells a user nothing.
      #
      # Nor could any audit here speak for consumers: they reach Astro through
      # the `astro: ">=4"` peer range, resolved against their own install, and
      # nothing in this lockfile models that.
      - name: Assert the package ships no runtime dependencies
        run: |
          node -e '
            const pkg = require("./package/package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error(`Runtime dependencies added: ${deps.join(", ")}`);
              console.error("Consumers now inherit these, so they need auditing.");
              console.error("Add a real audit step alongside this assertion.");
              process.exit(1);
            }
            console.log("OK: no runtime dependencies, nothing reaches consumers");
          '

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Fetched and checksum-verified rather than run via a third-party action.
      # This job polices the supply chain of the workflows, so it should not
      # widen it — reviewdog/action-setup, the usual wrapper for actionlint,
      # was compromised in the same March 2025 incident as tj-actions.
      # shellcheck is preinstalled on ubuntu-latest; actionlint uses it to
      # check `run:` blocks, including the publish script in release.yml.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
