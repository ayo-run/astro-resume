name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Type-checks the demo site, which consumes the package the same way a
      # real project does — so it also catches breaking changes to the types.
      - name: Astro check (demo)
        run: pnpm check

      # Publishing no runtime dependencies is what keeps a consumer's tree
      # clean no matter what this repo's dev lockfile carries. Assert that
      # invariant rather than audit it.
      #
      # `pnpm audit --prod` was the obvious check here and is the wrong one:
      # audit reads the whole workspace lockfile and ignores --filter, so its
      # "production" scope is the demo app's 182-package Astro tree and none
      # of what we publish. Pinning the demo back to astro 6.1.3 turns it red
      # with `demo>astro` paths — a failure that tells a user nothing.
      #
      # Nor could any audit here speak for consumers: they reach Astro through
      # the `astro: ">=4"` peer range, resolved against their own install, and
      # nothing in this lockfile models that.
      # String concatenation rather than a template literal on purpose: the
      # `${...}` of a literal sits inside the single-quoted `node -e` argument,
      # and shellcheck reads it as a shell expansion that will not expand
      # (SC2016), which actionlint promotes to a CI failure.
      - name: Assert the package ships no runtime dependencies
        run: |
          node -e '
            const pkg = require("./package/package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("Runtime dependencies added: " + deps.join(", "));
              console.error("Consumers now inherit these, so they need auditing.");
              console.error("Add a real audit step alongside this assertion.");
              process.exit(1);
            }
            console.log("OK: no runtime dependencies, nothing reaches consumers");
          '

      # npm builds the tarball and then RE-READS package.json to get the
      # manifest it sends to the registry — "so that we send the latest and
      # greatest thing", per npm's own publish source. That re-read happens
      # after `postpack`.
      #
      # So a `postpack` that deleted the README `prepack` had just copied in
      # would leave the tarball correct and the *manifest* empty: the registry
      # stores `readme: "ERROR: No README data found!"` and the npm page renders
      # blank. That is what every release up to and including v1.1.0 shipped.
      #
      # Asserting on the tarball would not have caught it — the tarball had the
      # README the whole time. Assert instead that the README is still on disk
      # once packing is done, because that is the state npm publishes from.
      - name: Assert the published manifest will carry a README
        working-directory: package
        run: |
          rm -f README.md
          npm pack --dry-run > /dev/null
          if [ ! -s README.md ]; then
            echo "package/README.md is absent or empty after packing."
            echo "npm re-reads the manifest at this point, so the registry"
            echo "would receive no README and the npm page would be blank."
            echo "Look for a postpack script that removes it."
            exit 1
          fi
          echo "OK: README survives packing, so the published manifest carries it"

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The same script the pre-commit hook runs, so the pinned version and its
      # checksum are defined in one place and a contributor can reproduce this
      # job exactly. It fetches and checksum-verifies actionlint rather than
      # using a third-party action — see the script for why.
      #
      # shellcheck is preinstalled on ubuntu-latest, so `run:` blocks are
      # checked here. The script warns when it is missing locally, because
      # actionlint skips those checks silently rather than failing.
      - name: Run actionlint
        run: ./scripts/lint-workflows.sh
